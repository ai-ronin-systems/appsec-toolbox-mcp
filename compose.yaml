services:
  appsec-toolbox-mcp:
    build:
      context: .
      args:
        MAKEFILE_MCP_SPEC: ${MAKEFILE_MCP_SPEC:-makefile-mcp==0.2.2}
    stdin_open: true
    # Run as the host user so reports in OUTPUT_DIR are writable and owned by you:
    # HOST_UID="$(id -u)" HOST_GID="$(id -g)" docker compose run ...
    user: "${HOST_UID:-10001}:${HOST_GID:-10001}"
    read_only: true
    # The /tmp tmpfs counts toward the memory limit; scanners peak near 2 GB on small targets.
    mem_limit: 6g
    pids_limit: 512
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=3g
    # Offline: APPSEC_OFFLINE=1 APPSEC_NETWORK=none, with OFFLINE_DATA_DIR from `make offline-data`.
    network_mode: ${APPSEC_NETWORK:-bridge}
    environment:
      APPSEC_LANGS: ${APPSEC_LANGS:-auto}
      APPSEC_OFFLINE: ${APPSEC_OFFLINE:-0}
    volumes:
      - ${TARGET_DIR:?Set TARGET_DIR to the repository to audit}:/runner/target:ro
      - ${OUTPUT_DIR:-./output}:/runner/output:rw
      - ${OFFLINE_DATA_DIR:-./offline-data}:/runner/offline-data:ro
