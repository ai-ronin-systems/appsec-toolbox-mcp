name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  IMAGE: ghcr.io/ai-ronin-systems/appsec-toolbox-mcp

jobs:
  ci:
    name: Full CI gate
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    name: Build and test the release image
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Read-only: this job runs project code (Dockerfile, tests) and holds no publishing credentials.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify release tag belongs to main
        run: |
          tag_commit="$(git rev-list -n 1 "$GITHUB_REF_NAME")"
          if ! git merge-base --is-ancestor "$tag_commit" origin/main; then
            echo "::error::Release tag must point to a commit reachable from main."
            exit 1
          fi

      - name: Verify tag, VERSION, and CHANGELOG agree
        run: |
          version="$(cat VERSION)"
          test "$GITHUB_REF_NAME" = "v${version}" \
            || { echo "::error::tag ${GITHUB_REF_NAME} does not match VERSION ${version}"; exit 1; }
          grep -Eq "^## ${version} — [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md \
            || { echo "::error::CHANGELOG.md has no dated section for ${version}"; exit 1; }

      - name: Build the image once
        run: docker build -t appsec-toolbox-mcp:release .

      # The exact image that will be published passes the known-positive scan first.
      - name: Known-positive image test
        run: make test-image IMAGE=appsec-toolbox-mcp:release

      - name: Export the tested image
        run: docker save appsec-toolbox-mcp:release | gzip -1 > image.tar.gz

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-image
          path: image.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Push to GHCR
    needs: build
    runs-on: ubuntu-latest
    # Can push packages but runs no project code: it only loads and pushes the tested image.
    permissions:
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-image

      - name: Push version and latest tags
        id: push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gunzip -c image.tar.gz | docker load
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for tag in "$version" latest; do
            docker tag appsec-toolbox-mcp:release "${IMAGE}:${tag}"
            docker push "${IMAGE}:${tag}"
          done
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "${IMAGE}:${version}")"
          echo "digest=${digest#*@}" >> "$GITHUB_OUTPUT"

  attest:
    name: Attest build provenance
    needs: publish
    runs-on: ubuntu-latest
    # The only job that can mint an OIDC token. It runs no project code.
    permissions:
      id-token: write
      attestations: write
      packages: write
      artifact-metadata: write
    steps:
      # push-to-registry stores the attestation next to the image, which needs a GHCR login.
      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ needs.publish.outputs.digest }}
          push-to-registry: true

  github-release:
    name: Create GitHub release
    needs: [publish, attest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create release from the pushed tag
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "appsec-toolbox-mcp ${GITHUB_REF_NAME#v}" \
            --notes "Image: \`${IMAGE}:${GITHUB_REF_NAME#v}\` (\`${DIGEST}\`). Verify with \`gh attestation verify oci://${IMAGE}:${GITHUB_REF_NAME#v} --owner ai-ronin-systems\`."
