name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The smoke test runs tasks through Makefile MCP; install the same version the image pins.
      - name: Install pinned Makefile MCP
        run: |
          spec="$(sed -n 's/^ARG MAKEFILE_MCP_SPEC="\(.*\)"/\1/p' Dockerfile)"
          test -n "$spec"
          pipx install "$spec"
      - name: Smoke test
        run: make test
      - name: Validate Dockerfile parse/build metadata
        run: docker build --check .
