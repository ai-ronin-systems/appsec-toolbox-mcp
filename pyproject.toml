# Tooling settings only: the toolbox is shipped as an image, not as a Python package.
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
# Tests use assert; scripts run fixed scanner argv lists, never a shell.
per-file-ignores = { "tests/**" = ["S101", "S603", "S607"], "scripts/**" = ["S603", "S607"] }

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
