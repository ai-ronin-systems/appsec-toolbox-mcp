schema_version: 1

defaults:
  timeout_seconds: 1800

tasks:
  appsec-full:
    risk: safe
    timeout_seconds: 3600

  security-semgrep:
    risk: safe
    timeout_seconds: 1800

  security-gitleaks:
    risk: safe
    timeout_seconds: 1800

  security-osv:
    risk: safe
    timeout_seconds: 1800

  security-trivy:
    risk: safe
    timeout_seconds: 1800

  security-checkov:
    risk: safe
    timeout_seconds: 1800

  security-language:
    risk: safe
    timeout_seconds: 1800

  supply-chain-sbom:
    risk: safe
    timeout_seconds: 1800

  toolbox-check:
    enabled: false

  toolbox-versions:
    enabled: false

  test:
    enabled: false

  lint:
    enabled: false

  test-image:
    enabled: false

  image:
    enabled: false

  offline-data:
    enabled: false

# One JSON line per MCP task run (task, status, exit code, duration, output size and tail),
# written next to the scanner reports so the evidence records how it was produced.
audit:
  path: output/makefile-mcp-audit.jsonl

# Makefile MCP passes only PATH, HOME, and USER to tasks by default. The language profile
# selection, offline mode, and scanner caches must be inherited explicitly or they are silently dropped.
environment:
  inherit: [PATH, HOME, USER, XDG_CACHE_HOME, APPSEC_LANGS, APPSEC_OFFLINE]

capabilities:
  security.audit: appsec-full
  security.sast: security-semgrep
  security.secrets: security-gitleaks
  security.dependencies: security-osv
  security.repository: security-trivy
  security.iac: security-checkov
  security.language: security-language
  supply_chain.sbom: supply-chain-sbom
